name: 15-Min Market Scanner & Telegram Alert

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price Updater & Telegram Signal Scanner
        run: |
          python -c "import os; os.system('python core/price_updater.py' if os.path.exists('core/price_updater.py') else 'python price_updater.py')"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_analysis.json data/ || true
          git commit -m "Automated 15-Min Market & Signal Update [skip ci]" || echo "Değişiklik yok"
          git push
