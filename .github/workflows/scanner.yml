name: Market Session Scanner & Telegram Alert

on:
  schedule:
    # BIST Sabah Seansı (09:45 TSİ = 06:45 UTC) & Gün Ortası (13:30 TSİ = 10:30 UTC)
    - cron: '45 6 * * 1-5'
    - cron: '30 10 * * 1-5'
    # ABD Açılış Öncesi (17:15 TSİ = 14:15 UTC) & Kapanış Öncesi (22:30 TSİ = 19:30 UTC)
    - cron: '15 14 * * 1-5'
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Price, News & Telegram Signal Scanner (TSİ)
        run: |
          python core/price_updater.py

      - name: Commit and Push Updated Data & Embedded HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_analysis.json data/prediction_ledger.json index.html public/index.html web/index.html || true
          git commit -m "Automated Market, News & Portfolio Update (TSİ)" || echo "Değişiklik yok"
          git push
